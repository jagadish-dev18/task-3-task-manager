<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple task manager demonstrating create, read, update and delete operations with local storage.">
  <title>Everyday Tasks | Task Manager</title>
  <link rel="stylesheet" href="css/style.css"><script src="js/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header"><div><p class="eyebrow">A small productivity tool</p><h1>Everyday Tasks</h1><p class="subtitle">Keep the next step clear and manageable.</p></div><div class="date-label" id="today-label"></div></header>
    <section class="summary" aria-label="Task summary">
      <div><span id="total-count">0</span><small>Total tasks</small></div>
      <div><span id="active-count">0</span><small>To do</small></div>
      <div><span id="done-count">0</span><small>Completed</small></div>
    </section>
    <section class="task-panel" aria-labelledby="form-title">
      <h2 id="form-title">Add a task</h2>
      <form id="task-form" class="task-form">
        <label class="visually-hidden" for="task-input">Task name</label>
        <input id="task-input" name="task" type="text" maxlength="100" placeholder="What do you need to do?" required>
        <button class="add-button" type="submit" id="save-button">Add task</button>
        <button class="cancel-button" type="button" id="cancel-edit" hidden>Cancel</button>
      </form>
      <p class="form-hint" id="form-hint" aria-live="polite">Your tasks stay in this browser on this device.</p>
    </section>
    <section class="list-section" aria-labelledby="list-title">
      <div class="list-heading"><h2 id="list-title">Your list</h2><button type="button" id="clear-completed" class="text-button">Clear completed</button></div>
      <div class="filters" role="group" aria-label="Filter tasks">
        <button class="filter-button active" data-filter="all" type="button" aria-pressed="true">All</button>
        <button class="filter-button" data-filter="active" type="button" aria-pressed="false">Active</button>
        <button class="filter-button" data-filter="completed" type="button" aria-pressed="false">Completed</button>
      </div>
      <ul class="task-list" id="task-list" aria-live="polite"></ul>
      <p class="empty-state" id="empty-state">No tasks yet. Add one above to get started.</p>
    </section>
    <footer class="app-footer">Practice project · HTML, CSS, JavaScript and localStorage</footer>
  </main>
</body>
</html>
